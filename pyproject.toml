[project]
name = "model-benchmarking"
version = "0.1.0"
description = "Benchmarking image-based (Cell Painting) representation models against chemical-structure, bioactivity and transcriptomic representations of small molecules."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = [
    "cell painting",
    "image-based profiling",
    "morphological profiling",
    "transcriptomics",
    "DRUG-seq",
    "chemical checker",
    "representation learning",
    "CCA",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    # Core data handling
    "numpy>=1.26",
    "pandas>=2.2,<3",  # notebooks were run with pandas 2.2; pandas 3 changes string dtypes
    "pyarrow>=15",
    "duckdb>=1.0",
    "h5py>=3.10",
    # Cloud storage (all project data lives in Google Cloud Storage)
    "gcsfs>=2024.2",
    "google-cloud-storage>=2.14",
    # Statistics and machine learning
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "torch>=2.2",
    # Plotting
    "matplotlib>=3.8",
    "seaborn>=0.13",
    # Biology / chemistry
    "gseapy>=1.1",
    "mygene>=3.2",
    "rdkit>=2023.9",
    "pubchempy>=1.0.4",
    # Utilities
    "psutil>=5.9",
    "requests>=2.31",
    "tqdm>=4.66",
    "crcmod>=1.7",
]

[project.urls]
Repository = "https://github.com/axiomcura/ModelBenchmarking"

[dependency-groups]
dev = [
    "pytest>=8",
    "nbformat>=5.9",
    "pre-commit>=4",
    "ruff==0.16.9",
]
notebooks = [
    "jupyterlab>=4",
    "ipykernel>=6.29",
    "ipywidgets>=8",
]

[tool.uv]
default-groups = ["dev", "notebooks"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/model_benchmarking"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting (isort)
    "UP",   # pyupgrade: modern (3.10+) syntax, f-strings, builtin generics, X | None
    "B",    # flake8-bugbear: likely bugs
    "NPY",  # NumPy-specific rules
    "D",    # pydocstyle: docstrings
    "ANN",  # flake8-annotations: type hints
]
ignore = [
    "E501",    # line length is handled by the formatter; long strings (URLs, messages) are allowed
    "NPY002",  # np.random.seed / np.random.permutation are used deliberately for reproducibility
    "ANN401",  # typing.Any is allowed for plotting palettes
]

[tool.ruff.lint.per-file-ignores]
# Notebooks are analysis scripts: no docstring or annotation requirements, and their original
# variable names (X, Y, ...) and loop styles are kept.
"*.ipynb" = ["D", "ANN", "B007", "B905", "E741"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
known-first-party = ["model_benchmarking"]

[tool.codespell]
skip = "*.ipynb,uv.lock"
ignore-words-list = "fo,ot,nd"
